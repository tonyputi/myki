name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: tonyputi/.github/.github/workflows/generate-semantic-release.yml@main
    with:
      github_app_id: ${{ vars.GH_APP_ID }}
    secrets:
      github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
