find:
  name: Find tracker
  description: Make the tracker ring so you can locate it.
  target:
    entity:
      integration: myki
      domain: device_tracker

make_call:
  name: Make tracker call
  description: >-
    Make the tracker place a call to a phone number. The number should be in the
    tracker's SOS numbers or whitelist, otherwise the tracker may refuse the call.
  target:
    entity:
      integration: myki
      domain: device_tracker
  fields:
    phone:
      name: Phone number
      description: The number the tracker should call (including country prefix, e.g. +35679060465).
      required: true
      example: "+35679060465"
      selector:
        text:
