find:
  name: Find watch
  description: Make the watch ring so you can locate it.
  target:
    entity:
      integration: myki
      domain: device_tracker

make_call:
  name: Make watch call
  description: >-
    Make the watch place a call to a phone number. The number should be in the
    watch's SOS numbers or whitelist, otherwise the watch may refuse the call.
  target:
    entity:
      integration: myki
      domain: device_tracker
  fields:
    phone:
      name: Phone number
      description: The number the watch should call (including country prefix, e.g. +35679060465).
      required: true
      example: "+35679060465"
      selector:
        text:
