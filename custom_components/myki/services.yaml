find:
  name: Find tracker
  description: Make the tracker ring so you can locate it.
  target:
    entity:
      integration: myki
      domain: device_tracker

make_call:
  name: Make tracker call
  description: >-
    Call a shared SOS or whitelist slot using its current MyKi cloud number.
    Supply either contact or the legacy phone field, not both.
  target:
    entity:
      integration: myki
      domain: device_tracker
  fields:
    contact:
      name: Shared contact
      description: The existing MyKi contact slot to call.
      example: sos_1
      selector:
        select:
          options:
            - sos_1
            - sos_2
            - sos_3
            - whitelist_1
            - whitelist_2
            - whitelist_3
            - whitelist_4
            - whitelist_5
            - whitelist_6
            - whitelist_7
    phone:
      name: Phone number
      description: >-
        Deprecated. Only numbers already in an app-visible shared contact are accepted;
        use contact instead. International + and 00 prefixes are compared equivalently.
      example: "+15555550100"
      selector:
        text:
